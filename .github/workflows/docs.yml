name: Docs

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install MkDocs
        run: python -m pip install -r docs/requirements.txt
      # --strict fails on broken links and missing anchors
      - name: Build
        run: mkdocs build --strict
      - name: Upload site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site
          retention-days: 1

  # The Cloudflare token only reaches this job. It runs no code from this
  # repository or from PyPI: it downloads the built site and runs one pinned
  # wrangler. https://docs.github.com/en/actions/reference/security/secure-use
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Keep CLOUDFLARE_* as secrets of this environment, limited to main
    # (Settings > Environments), so no other job can read them.
    environment:
      name: cloudflare-pages
      url: https://cli.chilichip.eu
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          # Exact version: otherwise the action picks wrangler itself, outside any
          # lockfile, in the step that holds the token (chili-platform #199).
          wranglerVersion: "4.157.0"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=chilichip-cli --branch=main
