name: Runtime Tests - Setup

on:
  push:
  pull_request:

env:
  BUILD_TYPE: Release

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            name: Ubuntu / STM32
            cache-key: stm32
            release-suffix: STM32
            cmake-args: -DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/32blit-sdk/32blit.toolchain -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
            apt-packages: ccache gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib python3-setuptools python3-venv

    runs-on: ${{matrix.os}}

    steps:
    # Linux deps
    - name: Install Dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt update && sudo apt install ${{matrix.apt-packages}}

    - uses: actions/checkout@v4
    - name: Grab the SDK
      uses: actions/checkout@v4
      with:
        repository: 32blit/32blit-sdk
        path: 32blit-sdk

    # Ubuntu 22.04's pip and setuptools are too old for pyproject.toml metadata
    - name: Install 32Blit Tools
      run: |
        python3 -m venv venv
        venv/bin/pip install --upgrade pip
        venv/bin/pip install ./src
        echo "$GITHUB_WORKSPACE/venv/bin" >> $GITHUB_PATH

    - name: Test Setup Tool
      run: |
        python -m ttblit setup --project-name Test --author-name Test --sdk-path=$GITHUB_WORKSPACE/32blit-sdk --git --vscode --visualstudio

    - name: Create Build Environment
      run: cmake -E make_directory ${{runner.workspace}}/build

    - name: Configure CMake
      shell: bash
      working-directory: ${{runner.workspace}}/build
      run: cmake $GITHUB_WORKSPACE/test -DCMAKE_BUILD_TYPE=$BUILD_TYPE ${{matrix.cmake-args}}

    - name: Build
      working-directory: ${{runner.workspace}}/build
      shell: bash
      run: |
        ccache --zero-stats || true
        cmake --build . --config $BUILD_TYPE -j 2
        ccache --show-stats || true

  chilichip:
    name: chilichip new and build
    runs-on: ubuntu-latest

    steps:
    - name: Install Dependencies
      run: |
        sudo apt update && sudo apt install libsdl2-dev libsdl2-image-dev libsdl2-net-dev

    - uses: actions/checkout@v4
      with:
        path: chilichip-cli

    - name: Grab the SDK
      uses: actions/checkout@v4
      with:
        repository: chili-chip/32blit-sdk
        path: projects/32blit-sdk

    - name: Install chilichip
      run: |
        python3 -m venv venv
        venv/bin/pip install --upgrade pip
        venv/bin/pip install ./chilichip-cli/src
        echo "$GITHUB_WORKSPACE/venv/bin" >> $GITHUB_PATH

    - name: New game from the template
      working-directory: projects
      run: |
        git config --global user.name CI
        git config --global user.email ci@example.com
        echo n | chilichip new ci-game

    - name: Build for the desktop
      working-directory: projects/ci-game
      run: |
        chilichip build --desktop
        test -x out/build/linux/ci-game.elf
