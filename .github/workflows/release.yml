name: Release

on:
  push:
    tags:
      - 'v*'

# Read-only by default. Only the `release` job may write, and it runs no code
# from this repository or from PyPI: it gets the built files from `build`.
# https://docs.github.com/en/actions/reference/security/secure-use#use-the-principle-of-least-privilege
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Check the tag matches the version
        working-directory: src
        run: |
          version=$(sed -n "s/^__version__ = '\\(.*\\)'/\\1/p" ttblit/__init__.py)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in src/ttblit/__init__.py"
            exit 1
          fi
      - name: Build the wheel and sdist
        working-directory: src
        run: |
          python -m pip install build
          python -m build
      - name: Write the release notes from the changelog
        working-directory: src
        # the lines under this version's heading, up to the next version
        run: awk -v v="${GITHUB_REF_NAME#v}" '$0 == v {on = 1; getline; next} on && /^[0-9]+\.[0-9]+/ {exit} on' CHANGELOG.txt > ../notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            src/dist/
            notes.md
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - name: Create the GitHub release, or add the files to one made on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" src/dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" src/dist/* --title "chilichip $GITHUB_REF_NAME" --notes-file notes.md
          fi
