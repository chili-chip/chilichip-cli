name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check the tag matches the version
        working-directory: src
        run: |
          version=$(sed -n "s/^__version__ = '\\(.*\\)'/\\1/p" ttblit/__init__.py)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in src/ttblit/__init__.py"
            exit 1
          fi
      - name: Build the wheel and sdist
        working-directory: src
        run: |
          python -m pip install build
          python -m build
      - name: Write the release notes from the changelog
        working-directory: src
        # the lines under this version's heading, up to the next version
        run: awk -v v="${GITHUB_REF_NAME#v}" '$0 == v {on = 1; getline; next} on && /^[0-9]+\.[0-9]+/ {exit} on' CHANGELOG.txt > ../notes.md
      - name: Create the GitHub release, or add the files to one made on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" src/dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" src/dist/* --title "chilichip $GITHUB_REF_NAME" --notes-file notes.md
          fi
