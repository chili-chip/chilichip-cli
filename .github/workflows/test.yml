name: Python Tests

on:
  pull_request:
  push:
    branches:
      - main

# Read-only token by default (chili-platform #198).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]

    steps:
      - name: Install Dependencies
        run: |
          sudo apt update && sudo apt install gcc-arm-none-eabi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip tox
      - name: Run Tests
        working-directory: src
        run: |
          tox -e py
      # informational, never fails the build
      - name: Coverage summary
        if: ${{ matrix.python == '3.13' }}
        working-directory: src
        run: |
          echo '### Coverage' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          .tox/py/bin/coverage report >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "::notice title=Coverage::$(.tox/py/bin/coverage report --format=total)% of lines"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Lint the chilichip code
        working-directory: src
        run: |
          python -m pip install flake8 isort
          flake8 --ignore E501 chilichip tests/test_chilichip_*.py tests/fakes.py
          isort -c chilichip
