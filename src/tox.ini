[tox]
envlist = py,qa
skip_missing_interpreters = True

[testenv]
commands =
	coverage run -m pytest -v -r wsx
	coverage report
deps =
	mock
	pytest>=3.1
	coverage

[testenv:qa]
commands =
	check-manifest --ignore tox.ini,tests/*,tests/**,.coveragerc
	python -m build --sdist
	twine check dist/*
	flake8
	isort -c ttblit/ chilichip/
deps =
	build
	check-manifest
	flake8
	twine
	isort>=5.0.0

[flake8]
exclude =
	.tox,
	.eggs,
	.git,
	__pycache__,
	build,
	dist
ignore =
	E501
